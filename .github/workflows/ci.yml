name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are waste, but a push to main must always
  # finish: release-plz releases from main, so cancelling here would let a
  # commit reach crates.io unverified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything that does not need a Docker daemon, so formatting and lint
  # failures come back in seconds rather than behind the Dremio container.
  check:
    name: Format, lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --features tls -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --lib --test flight_sql --verbose
      - name: Run doctests
        run: cargo test --doc --verbose

  # The Docker-backed test boots dremio/dremio-oss, which takes minutes.
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run integration test
        run: cargo test --test lib --verbose
